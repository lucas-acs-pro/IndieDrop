<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IndieDrop – Loja de jogos</title>
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar" id="topbar"></div>

<div class="top">
<header class="head">
  <a class="logo" href="#inicio" id="logo"></a>
  <input id="q" type="search" placeholder="Buscar produtos…" aria-label="Buscar produtos">
  <button class="cartbtn" id="openCart">Carrinho (<span id="cnt">0</span>)</button>
</header>
<nav class="menu" id="nav" aria-label="Navegação"></nav>
</div>

<main id="app" aria-live="polite"></main>

<footer class="foot">
  <div class="wrap fgrid">
    <div>
      <h3>Receba novidades</h3>
      <p class="mut">Cadastro simulado: nada é enviado.</p>
      <form id="news"><input type="email" required placeholder="seu@email.com" aria-label="E-mail"><button class="btn">Inscrever</button></form>
    </div>
    <div><h3>Coleções</h3><div id="fGames"></div></div>
    <div><h3>Ajuda</h3><div id="fHelp"></div></div>
  </div>
  <p class="mut copy">Loja fictícia para demonstração, sem vínculo com os jogos citados. Produtos e preços são placeholders.</p>
</footer>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Carrinho">
  <div class="row"><h2 style="flex:1">Seu carrinho</h2><button class="x" id="closeCart" aria-label="Fechar carrinho">✕</button></div>
  <div class="items" id="items"></div>
  <div class="ship" id="ship"></div>
  <form class="cep" id="cepForm">
    <label for="cep">Calcular frete</label>
    <div class="row"><input id="cep" inputmode="numeric" autocomplete="postal-code" maxlength="9" placeholder="00000-000"><button class="chip">Calcular</button></div>
    <div id="fretes"></div>
  </form>
  <div class="row sum"><span>Subtotal</span><span id="sub">R$ 0,00</span></div>
  <div class="row sum"><span>Frete</span><span id="frt">—</span></div>
  <div class="row tot"><b>Total</b><b id="total">R$ 0,00</b></div>
  <button class="btn full" id="checkout">Finalizar compra</button>
</aside>
<div class="toast" id="toast" role="status"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
